name: SalesIA CI
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install '.[test]'
      - run: pytest
  integrated:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: salesia
          POSTGRES_USER: salesia
          POSTGRES_PASSWORD: salesia-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salesia -d salesia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'backend[test]'
      - name: Apply migrations and test API
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://salesia:salesia-test@localhost:5432/salesia
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
          ENVIRONMENT: test
        run: alembic upgrade head && pytest

