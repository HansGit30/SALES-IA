services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: salesia
      POSTGRES_USER: salesia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesia-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - salesia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesia -d salesia"]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.bootstrap"]
    environment:
      DATABASE_URL: postgresql+psycopg://salesia:${POSTGRES_PASSWORD:-salesia-local-only}@db:5432/salesia
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Define ADMIN_EMAIL en el archivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administración SalesIA}
      COMPANY_NAME: ${COMPANY_NAME:-SalesIA Enterprise}
      COMPANY_CURRENCY: ${COMPANY_CURRENCY:-PEN}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://salesia:${POSTGRES_PASSWORD:-salesia-local-only}@db:5432/salesia
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el archivo .env}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      AUTH_WINDOW_SECONDS: ${AUTH_WINDOW_SECONDS:-900}
      AUTH_ACCOUNT_ATTEMPTS: ${AUTH_ACCOUNT_ATTEMPTS:-10}
      AUTH_IP_ATTEMPTS: ${AUTH_IP_ATTEMPTS:-100}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=15)"]
      interval: 20s
      timeout: 16s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - salesia_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  salesia_pgdata:
  salesia_node_modules:
